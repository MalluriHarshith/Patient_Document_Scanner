services:
  - type: web
    name: healthcare-ai-app
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_NAME
        value: "healthcare_db"
      - key: MONGODB_URI
        sync: false
