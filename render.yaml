services:
  # =========================================================================
  # Option 1: Full-Stack Web Service (Single Unified Service - Recommended)
  # =========================================================================
  - type: web
    name: healthcare-ai-fullstack
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_NAME
        value: "healthcare_db"
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # =========================================================================
  # Option 2: Standalone Backend Web Service (If deploying Frontend separately)
  # =========================================================================
  - type: web
    name: healthcare-ai-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_NAME
        value: "healthcare_db"
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
